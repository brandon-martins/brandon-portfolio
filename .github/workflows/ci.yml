name: CI
on:
  push:
  pull_request:

# Same gates as local: format → lint → typecheck → test → build → Lighthouse. A failure at any step blocks the merge, except Lighthouse, which is advisory for now.
# `npm ci` installs every workspace at once; the client/server `pre*` scripts build packages/shared before they need it.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lighthouse budget (≥ 90 in every category)
        # Advisory for now: scores vary from run to run and the performance score is borderline, so a miss shows as a
        # warning instead of failing the job. Remove `continue-on-error` once performance is fixed and stable.
        continue-on-error: true
        run: npx lhci autorun
